# Development override: live source (edit, restart the service, no rebuild).
# Usage: docker compose -f docker-compose.yml -f docker/docker-compose.dev.yml up --build
# The debugger variant is ../docker-compose.debug.yml; the hardened variant is docker-compose.prod.yml.

services:
  streamlit:
    environment:
      - STREAMLIT_LOGGER_LEVEL=debug
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./streamlit_app.py:/app/streamlit_app.py
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --logger.level=debug

  api:
    environment:
      - DEBUG=1
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./web/dist:/app/web/dist:ro
