# =============================================================================
# Banking Campaigns Comparator - Feature Dictionary
# =============================================================================
# This file is the SINGLE SOURCE OF TRUTH for the campaign dataset.
# The dataset schema, the validator and the generated documentation are all
# derived from it, so they cannot drift apart.
#
# PRD reference: FR-06 (maintain a feature dictionary), D-03 (deliverable).
# Plan reference: Stephane, Day 1 (draft) -> Day 2 (freeze with Dan).
#
# FREEZE RULE (Project Plan section 3.2): after the Day 2 freeze, columns may be
# ADDED but never renamed or removed without all three team members agreeing,
# because the analysis code depends on them.
# =============================================================================

meta:
  name: Banking Campaigns Comparator - Feature Dictionary
  version: 0.1.0
  status: draft
  date: 2026-09-14
  owner: Stephane (Analysis & Generative AI Lead)
  contributors:
    - Dan (automatic extraction)
    - Siegried (rubric definitions, marketing principles)
  prd_reference: FR-06, FR-07, D-03, D-04
  freeze_target: End of Day 2 - Tuesday 15 September 2026
  grain: One row per campaign page per capture date.

# -----------------------------------------------------------------------------
# How a feature value is produced. Determines how much it can be trusted and who
# owns it (Project Plan section 4.2).
# -----------------------------------------------------------------------------
extraction_methods:
  automatic:
    description: Computed by code, deterministic, reproducible exactly.
    trust: high
    owner: Dan
  rubric:
    description: Scored by a human against a written scale with defined levels.
    trust: medium
    owner: Siegried
    requirement: Scored by one named human against the written scale. No inter-rater reliability is measured - single-judge bias is out of scope for this proof of concept and is listed as future work.
  model_assisted:
    description: Produced by an LLM or vision model with the prompt and model version recorded.
    trust: medium
    owner: Stephane
    requirement: Validated against human labels on a sample; agreement reported (FR-18).
  derived:
    description: Computed from other features in this dictionary. Never entered by hand.
    trust: high
    owner: Stephane

# -----------------------------------------------------------------------------
# How far a feature travels. This is the answer to risk R-06 (language) and
# R-05 (campaigns change mid-project) in the PRD.
# -----------------------------------------------------------------------------
comparability:
  cross_language:
    description: Comparable across NL / FR / EN pages without adjustment.
  within_language:
    description: >
      Only comparable between pages in the SAME language. Text-length and
      readability metrics are language-specific; comparing a Dutch word count to
      a French one measures the language, not the bank.
  within_capture_window:
    description: >
      Only comparable between pages captured in the same window. Valid for the
      capture date only (DR-05).

# -----------------------------------------------------------------------------
# Tiers. 'core' is the Day 6 MVP minimum - the chain must work end to end on
# these. 'extended' is added only once core is complete (Plan section 2.3).
# -----------------------------------------------------------------------------
tiers:
  core: Required for the MVP. A row missing a core feature is incomplete.
  extended: Added after the Day 6 gate passes. Nice to have, never blocking.

dimensions:
  provenance:
    label: Provenance & compliance
    prd_ref: DR-02, DR-05, LC-01
  tone_messaging:
    label: Tone & messaging
    prd_ref: PRD section 11 - "Is it formal, simple, persuasive?"
  topics_value_prop:
    label: Topics & value proposition
    prd_ref: PRD section 11 - "What is being offered? How is it framed?"
  visuals:
    label: Visuals & illustrations
    prd_ref: PRD section 11 - "What kind of images are used? What do they show?"
  colours_design:
    label: Colours & design
    prd_ref: PRD section 11 - "How is attention guided? What stands out?"
  layout_structure:
    label: Layout & structure
    prd_ref: PRD section 11 - "Is the page easy to read? How is it organised?"
  marketing_principles:
    label: Marketing principles
    prd_ref: Plan section 4.3 - AIDA, Cialdini, feature-advantage-benefit
  banking_domain:
    label: Banking-domain signals (Siegried's addendum)
    prd_ref: PRD section 11 bis / Plan section 4.3 bis - retail-banking angles a generic marketing framework misses

# =============================================================================
# FEATURES
# =============================================================================
features:

  # --- Provenance & compliance ------------------------------------------------
  - name: page_id
    dimension: provenance
    definition: Unique key for the page-capture. Format {bank}_{product_family}_{language}_{nn}.
    type: string
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: false
    primary_key: true

  - name: bank
    dimension: provenance
    definition: Bank whose page this is.
    type: categorical
    # vdk, hellobank and beobank added to the bank enum when they
    # became collectable in the current_account_pack family (freeze rule allows
    # pure additions; see scripts/check_schema_freeze.py).
    values: [ing, kbc, bnp_paribas_fortis, argenta, crelan, belfius, revolut, n26, bunq,
             vdk, hellobank, beobank, cbc, keytrade]
    extraction: automatic
    source: manual
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  - name: bank_category
    dimension: provenance
    definition: Traditional incumbent or digital challenger. The axis BO-02 asks about.
    type: categorical
    values: [traditional, challenger]
    extraction: automatic
    source: manual
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  - name: product_family
    dimension: provenance
    definition: Product family the page promotes. Comparisons are only valid within one family (DR-04).
    type: categorical
    # "pension" added - Belfius's pension page was carrying the
    # catch-all "other", which hid it from any family-scoped comparison.
    # Addition only (freeze rule): no existing value renamed or removed.
    values: [term_account, current_account_pack, savings_account, mortgage, investment, pension, other]
    extraction: automatic
    source: manual
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  - name: page_role
    dimension: provenance
    definition: What the page is for within the funnel.
    type: categorical
    values: [campaign_landing, product_detail, comparison, other]
    extraction: automatic
    source: manual
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  - name: url
    dimension: provenance
    definition: Full source URL as fetched.
    type: string
    extraction: automatic
    source: url
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  - name: language
    dimension: provenance
    definition: Language of the page version captured.
    type: categorical
    values: [nl, fr, en]
    extraction: automatic
    source: html
    comparability: cross_language
    tier: core
    required: true
    nullable: false
    notes: Controls every within_language feature. Fixing one language is decision 2 in the plan.

  - name: captured_at
    dimension: provenance
    definition: UTC timestamp of the fetch. Every conclusion is valid for this date only.
    type: datetime
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  - name: collection_method
    dimension: provenance
    definition: >
      How the page was retrieved. Static fetch misses JavaScript-built layout
      (risk R-02). manual_capture is a page a person opened in a normal browser
      and saved, used where an edge/CDN declines automated traffic - the content
      is identical, but there is no HTTP status of our own and the capture time
      is the person's, not the pipeline's.
    type: categorical
    # headful_render added - real visible Chrome for hosts that
    # refuse headless clients (BNP Paribas Fortis). Freeze rule: addition.
    values: [static_fetch, headless_render, headful_render, manual_capture]
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  - name: robots_allowed
    dimension: provenance
    definition: >
      Whether robots.txt allowed this path for the user agent used, checked before fetching.
      Carried in the row so compliance evidence travels with the data (LC-01).
    type: boolean
    extraction: automatic
    source: url
    comparability: cross_language
    tier: core
    required: true
    nullable: false
    notes: A row with robots_allowed = false must never exist. The validator treats it as a hard error.

  - name: snapshot_html_path
    dimension: provenance
    definition: Relative path to the stored raw HTML snapshot.
    type: string
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  - name: screenshot_path
    dimension: provenance
    definition: Relative path to the stored full-page screenshot.
    type: string
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  - name: data_source
    dimension: provenance
    definition: >
      Whether the row is a real capture or a synthetic fixture row. Guards against
      fixture data reaching a finding.
    type: categorical
    values: [real, synthetic_fixture, llm_generated]
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: false
    notes: llm_generated marks a campaign produced in the stretch step, scored by the same extractor.

  # Decision 6 in the plan (owner: me, due Day 2) says "one model,
  # version recorded, prompts stored in the repository". The recording half was
  # missing: collection/llm_extractor.py falls back across providers when one is
  # rate-limited, so a single run can label ING with one model and Revolut with
  # another - and nothing in the dataset would say so. That silently breaks
  # NFR-02 ("every feature is computed by the same code path for every bank").
  # This column makes the mix visible, and schema.validate() warns when a
  # dataset contains more than one.
  - name: extraction_model
    dimension: provenance
    definition: >
      Provider and model that produced the model_assisted fields for this row,
      as "provider/model". Blank for rows with no model-assisted features.
    type: string
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: false
    nullable: true
    notes: >
      Comparisons are only fair when every bank was labelled by the same model.
      A dataset mixing models is not invalid, but the mix has to be reported as
      a limitation (D-09) rather than discovered afterwards.

  # added after the first real collection run. Two of six rows were
  # unusable - ING rendered as an empty JavaScript shell (16 words, body text was
  # just the <title>), BNP returned a maintenance page - and NOTHING caught it.
  # Every numeric feature on those rows was in range and honestly measured; they
  # were honest measurements of the wrong page. A range check cannot catch that,
  # so the verdict travels with the row instead, like robots_allowed does.
  - name: capture_quality
    dimension: provenance
    definition: >
      Whether the captured page looks like a real campaign page. 'unusable' means
      an error/maintenance page or a shell that never rendered its content, and
      the row must be excluded from analysis.
    type: categorical
    values: [ok, suspect, unusable]
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: false
    nullable: true
    notes: >
      Deliberately conservative - a genuinely short challenger page is 'suspect',
      not 'unusable'. Only unambiguous cases are excluded automatically.

  # BNP's entire site was serving a maintenance notice with HTTP
  # 503 and we recorded it as a normal capture - a 503 still renders a page.
  # The status was never looked at. Now it is, and the quality gate fails any
  # non-2xx outright.
  - name: http_status
    dimension: provenance
    definition: HTTP status returned when the page was fetched. Anything other than 2xx is not a campaign page.
    type: integer
    range: [100, 599]
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: false
    nullable: true

  - name: shadow_hosts_flattened
    dimension: provenance
    definition: >
      Number of shadow roots inlined into the HTML before extraction. Above zero
      means the page is built from web components and would have been largely
      invisible to a light-DOM-only extractor.
    type: integer
    range: [0, null]
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: false
    nullable: true

  - name: capture_quality_note
    dimension: provenance
    definition: Why capture_quality got that verdict, in words, for the limitations section.
    type: string
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: false
    nullable: true

  # --- Tone & messaging -------------------------------------------------------
  - name: word_count
    dimension: tone_messaging
    definition: Visible words in the page body, excluding navigation, footer and cookie banner.
    type: integer
    unit: words
    range: [0, null]
    extraction: automatic
    source: html_text
    comparability: within_language
    tier: core
    required: true
    nullable: false
    notes: The deck calls Belfius "pretty verbose" and Revolut "very few text". This is the test.

  - name: sentence_count
    dimension: tone_messaging
    definition: Number of sentences in the page body.
    type: integer
    range: [0, null]
    extraction: automatic
    source: html_text
    comparability: within_language
    tier: extended
    required: false
    nullable: true

  - name: avg_sentence_length
    dimension: tone_messaging
    definition: Mean words per sentence.
    type: float
    unit: words
    range: [0, null]
    extraction: automatic
    source: html_text
    comparability: within_language
    tier: core
    required: true
    nullable: true

  - name: readability_score
    dimension: tone_messaging
    definition: Readability index of the body text. Higher means easier.
    type: float
    extraction: automatic
    source: html_text
    comparability: within_language
    tier: core
    required: true
    nullable: true
    notes: >
      Formula differs per language - see readability_formula. Raw scores are NOT
      comparable across languages; use readability_band for cross-language work.

  - name: readability_formula
    dimension: tone_messaging
    definition: Which readability formula produced readability_score.
    type: categorical
    values: [flesch_douma_nl, kandel_moles_fr, flesch_reading_ease_en]
    extraction: automatic
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  - name: readability_band
    dimension: tone_messaging
    definition: Readability score bucketed into language-neutral bands, so it can cross languages.
    type: categorical
    values: [very_easy, easy, medium, hard, very_hard]
    extraction: derived
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  - name: word_count_band
    dimension: tone_messaging
    definition: word_count bucketed into fixed-threshold bands, so it can be compared across languages.
    type: categorical
    values: [very_short, short, medium, long]
    extraction: derived
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    notes: >
      same idea as readability_band, but fixed universal cutoffs rather than a
      language-normalising formula (word_count has no such formula). REDUCES the cross-language
      comparability problem, does not eliminate it - French runs ~15-20% longer than English for
      the same content. See src/comparator/bands.py for the thresholds.

  - name: sentence_count_band
    dimension: tone_messaging
    definition: sentence_count bucketed into fixed-threshold bands, so it can be compared across languages.
    type: categorical
    values: [very_short, short, medium, long]
    extraction: derived
    source: derived
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    notes: same caveat as word_count_band.

  - name: avg_sentence_length_band
    dimension: tone_messaging
    definition: avg_sentence_length bucketed into fixed-threshold bands, so it can be compared across languages.
    type: categorical
    values: [short_sentences, medium_sentences, long_sentences]
    extraction: derived
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    notes: same caveat as word_count_band.

  - name: second_person_ratio_band
    dimension: tone_messaging
    definition: second_person_ratio bucketed into fixed-threshold bands, so it can be compared across languages.
    type: categorical
    values: [rarely_direct, sometimes_direct, mostly_direct]
    extraction: derived
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    notes: a ratio travels a little better across languages than a raw count, banded anyway for consistency with the rest of this set.

  - name: first_person_plural_band
    dimension: tone_messaging
    definition: first_person_plural_count bucketed into fixed-threshold bands, so it can be compared across languages.
    type: categorical
    values: [rare, occasional, frequent]
    extraction: derived
    source: derived
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    notes: same caveat as word_count_band.

  - name: disclaimer_word_share_band
    dimension: topics_value_prop
    definition: disclaimer_word_share bucketed into fixed-threshold bands, so it can be compared across languages.
    type: categorical
    values: [minimal, moderate, heavy]
    extraction: derived
    source: derived
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    notes: same caveat as word_count_band.

  - name: text_to_image_ratio_band
    dimension: layout_structure
    definition: text_to_image_ratio bucketed into fixed-threshold bands, so it can be compared across languages.
    type: categorical
    values: [image_heavy, balanced, text_heavy]
    extraction: derived
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    notes: same caveat as word_count_band; also inherits the text_to_image_ratio approximation noted in collection/scraper.py for static_fetch rows.

  - name: second_person_ratio
    dimension: tone_messaging
    definition: Share of personal pronouns that address the reader (je/u/jij, vous/tu, you).
    type: float
    range: [0, 1]
    extraction: automatic
    source: html_text
    comparability: within_language
    tier: core
    required: true
    nullable: true
    notes: Direct address is a known challenger-bank marker. Cheap to compute, high signal.

  - name: first_person_plural_count
    dimension: tone_messaging
    definition: Occurrences of bank-as-we pronouns (wij/we, nous, we/our).
    type: integer
    range: [0, null]
    extraction: automatic
    source: html_text
    comparability: within_language
    tier: extended
    required: false
    nullable: true

  - name: question_count
    dimension: tone_messaging
    definition: Number of question marks in body text.
    type: integer
    range: [0, null]
    extraction: automatic
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  - name: urgency_marker_count
    dimension: tone_messaging
    definition: >
      Occurrences of scarcity or deadline language, matched against a per-language
      term list (only until, limited offer, nog tot, offre limitee, ...).
    type: integer
    range: [0, null]
    extraction: automatic
    source: html_text
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    notes: year corrected. The ING term-account promo carries "This offer is only available until 13/10/2026".

  - name: numeric_claim_count
    dimension: tone_messaging
    definition: Count of numeric claims in body text (percentages, amounts, durations).
    type: integer
    range: [0, null]
    extraction: automatic
    source: html_text
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  - name: formality_score
    dimension: tone_messaging
    definition: How formal the register is. 1 = conversational, 5 = institutional.
    type: integer
    range: [1, 5]
    extraction: rubric
    source: html_text
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    rubric:
      1: Speaks like a friend. Contractions, slang, direct address throughout.
      2: Informal but composed. Direct address, short sentences, no jargon.
      3: Neutral business register.
      4: Formal. Full forms of address, product and regulatory vocabulary.
      5: Institutional and legalistic. Reads like a product sheet.

  - name: clarity_score
    dimension: tone_messaging
    definition: How easily a first-time reader grasps the offer. 1 = opaque, 5 = immediate.
    type: integer
    range: [1, 5]
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      1: Can't tell what's being offered without reading twice.
      2: Vague - the product is named but the offer itself (rate, benefit, condition) is unclear.
      3: Understandable with effort - the offer is there but buried among secondary information.
      4: Clear - offer, audience and next step are identifiable at a glance.
      5: Immediate - the value proposition is unmistakable within the first few seconds.

  # --- Topics & value proposition ---------------------------------------------
  - name: primary_product
    dimension: topics_value_prop
    definition: The specific product named on the page, in the page's own words.
    type: string
    extraction: model_assisted
    source: html_text
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  - name: rate_shown
    dimension: topics_value_prop
    definition: Whether an interest rate or price is displayed on the page.
    type: boolean
    extraction: automatic
    source: html_text
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  - name: rate_value_pct
    dimension: topics_value_prop
    definition: The headline rate as a percentage, when one is shown.
    type: float
    unit: percent
    range: [0, null]
    extraction: automatic
    source: html_text
    comparability: within_capture_window
    tier: core
    required: false
    nullable: true
    notes: Rates move. Only comparable between pages captured in the same window.

  - name: rate_prominence
    dimension: topics_value_prop
    definition: Where the rate sits in the visual hierarchy.
    type: categorical
    values: [hero, above_fold, below_fold, absent]
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      hero: The rate is the largest or most visually dominant element on the page.
      above_fold: The rate is visible without scrolling, but is not the dominant visual element.
      below_fold: The rate only appears after scrolling.
      absent: No rate is shown anywhere on the page.

  - name: benefit_framing
    dimension: topics_value_prop
    definition: Whether the offer is argued with figures, with feelings, or both.
    type: categorical
    values: [rational, emotional, mixed]
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  - name: fab_level
    dimension: topics_value_prop
    definition: >
      Dominant level of the feature-advantage-benefit ladder. "3.2% gross annual"
      is a feature; "your money works while you sleep" is a benefit.
    type: categorical
    values: [feature, advantage, benefit]
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  - name: value_prop_clarity
    dimension: topics_value_prop
    definition: How clearly the page states what is offered, to whom, against which alternative.
    type: integer
    range: [1, 5]
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      1: No stated value proposition - reads like a product description, not an offer.
      2: What is offered is named, but who it is for and the alternative are absent.
      3: What and who are clear, but the implied alternative is absent or only implicit.
      4: What, who and the implied alternative are all identifiable.
      5: What, who and the alternative are explicit and quantified.

  - name: disclaimer_present
    dimension: topics_value_prop
    definition: Whether legal or risk disclaimers appear on the page.
    type: boolean
    extraction: automatic
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  - name: disclaimer_word_share
    dimension: topics_value_prop
    definition: Share of body words that sit inside disclaimer blocks.
    type: float
    range: [0, 1]
    extraction: automatic
    source: html_text
    comparability: within_language
    tier: extended
    required: false
    nullable: true

  # --- Visuals & illustrations ------------------------------------------------
  - name: image_count
    dimension: visuals
    definition: Number of content images, excluding icons under 32px and tracking pixels.
    type: integer
    range: [0, null]
    extraction: automatic
    source: dom
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  - name: hero_image_present
    dimension: visuals
    definition: Whether a single large image occupies the top of the page.
    type: boolean
    extraction: automatic
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: false
    notes: The deck says Fortis and ING both lead with "1 very large picture on the top".

  - name: hero_image_area_ratio
    dimension: visuals
    definition: Hero image area as a share of the above-the-fold viewport.
    type: float
    range: [0, 1]
    extraction: automatic
    source: screenshot
    comparability: cross_language
    tier: extended
    required: false
