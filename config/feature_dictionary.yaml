  # agreed candidate from the "what am I missing" discussion - a
  # classic challenger acquisition lever the deck itself doesn't name but the
  # market clearly plays on. The other two candidates from that discussion
  # (PSD2 account aggregation, remote-advisor video/chat) were rejected: the
  # first is a product feature rarely surfaced on a CAMPAIGN page (this
  # dictionary measures communication, not the app), the second would muddy
  # primary_cta_type without a clear enough signal on a landing page to trust.
  - name: fast_digital_onboarding_claim
    dimension: banking_domain
    definition: Whether the page claims a fast, frictionless digital account-opening process (e.g. "open an account in 5 minutes", no branch visit needed, instant approval).
    type: boolean
    extraction: model_assisted
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    notes: structurally unavailable to a neobank; a hard marker of business model.

  # gap flagged while preparing tonight's Day 2 freeze - none of
  # the existing banking-domain features distinguish a page aimed at someone new to
  # investing (beginner framing, low minimum, educational tone) from one aimed
  # at an experienced investor, even though product_family already has
  # "investment". Same lifetime-value acquisition logic as youth_student_targeting,
