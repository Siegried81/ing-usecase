  # --- Layout & structure -----------------------------------------------------
  - name: page_height_px
    dimension: layout_structure
    definition: Full rendered page height at a fixed 1440x900 viewport.
    type: integer
    unit: pixels
    range: [0, null]
    extraction: automatic
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    notes: >
      Viewport must be identical for every capture or this feature is meaningless.
      widened to nullable. A manually saved capture (collection_method
      = manual_capture) carries a VIEWPORT screenshot, not a full-page one, so the
      page height genuinely cannot be measured from it - Siegried's saves are
      ~1,000px tall for pages we measure live at 12,000px. Deriving a height from
      them would be inventing one. Blank is the honest value, and the feature
      accounting already drops a feature that is missing for some bank.

  - name: section_count
    dimension: layout_structure
    definition: Number of distinct content blocks on the page.
    type: integer
    range: [0, null]
    extraction: automatic
    source: dom
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  - name: cta_count
    dimension: layout_structure
    definition: Number of distinct call-to-action buttons or links.
    type: integer
    range: [0, null]
    extraction: automatic
    source: dom
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  - name: cta_above_fold
    dimension: layout_structure
    definition: Whether at least one call to action is visible without scrolling.
    type: boolean
    extraction: automatic
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: false

  # was boolean (beside vs not), which forced a real 3rd
  # pattern into a false it doesn't belong in: text written directly ON TOP of
  # a full-bleed image (N26's hero, confirmed from a real screenshot) is
  # neither "beside" nor "stacked", and conflating it with "stacked" would
  # have erased a genuine traditional/challenger design signal. Renamed from
  # text_image_adjacent since "adjacent" no longer describes a 3-value field.
  - name: text_image_layout
    dimension: layout_structure
    definition: >
      How the dominant pattern relates text and image: side by side (beside),
      one above the other (stacked), or text written directly on top of the
      image (overlaid, e.g. a full-bleed hero photo with a headline over it).
    type: categorical
    values: [beside, stacked, overlaid]
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      beside: Text and image sit side by side, both fully visible (e.g. photo left, text block right).
      stacked: Image and text follow each other vertically, not overlapping.
      overlaid: Text is written directly on top of the image (e.g. a full-bleed hero photo with a headline over it).
    notes: >
      The single observation the deck repeats for every bank. ING is called out as
      the one where "text and picture not anymore next to each other".
      no "no_image" value on purpose - a page with no image at all
      leaves this field null (nullable: true), it is not forced into one of the
      three categories above.

  - name: text_to_image_ratio
    dimension: layout_structure
    definition: Text area divided by image area in the rendered page.
    type: float
    range: [0, null]
    extraction: automatic
    source: screenshot
    comparability: within_language
    tier: core
    required: true
    nullable: true

  - name: above_fold_element_count
    dimension: layout_structure
    definition: Number of distinct interactive or content elements visible without scrolling.
    type: integer
    range: [0, null]
    extraction: automatic
    source: screenshot
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  - name: has_comparison_table
    dimension: layout_structure
    definition: Whether the page contains a product comparison table.
    type: boolean
    extraction: automatic
    source: dom
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  - name: layout_archetype
    dimension: layout_structure
    definition: Overall structural pattern of the page.
    type: categorical
    values: [hero_stacked, split_columns, card_grid, long_form]
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      hero_stacked: One large hero visual at the top, content stacked vertically below it.
      split_columns: The page is organised into two or more side-by-side columns throughout.
      card_grid: Content is organised as a grid of self-contained cards or tiles.
      long_form: Continuous scrolling sections with no strong grid or card structure.
    notes: >
      real pages often mix patterns (e.g. a hero_stacked header over
      a card_grid body) - score the pattern of the FIRST SCREEN (above the
      fold), not the page as a whole, so raters have one consistent rule.

  # gap flagged in the same discussion as first_time_investor_targeting.
  # HONEST LIMITATION: every capture uses one fixed 1440x900 viewport (see
  # page_height_px above) - this project never renders a page at a mobile
  # viewport, so this cannot be an automatic responsive-layout measurement. It
  # is scored as a visual impression of the design register instead (single
  # column, card-like, large tap targets vs multi-column, hover-dependent,
  # dense), same status as layout_archetype right above it.
  - name: mobile_first_design_signal
    dimension: layout_structure
    definition: Whether the page's visual design reads as built mobile-first (single-column cards, large tap targets, minimal above-fold density) rather than desktop-first (multi-column, hover-dependent, dense), judged from the desktop screenshot. Not a responsive/viewport measurement - this project only captures one fixed viewport.
    type: boolean
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      true: Single-column, card-like blocks, large tap-friendly buttons, minimal density above the fold.
      false: Multi-column layout, dense information, hover-dependent interactions.

  # --- Marketing principles ---------------------------------------------------
  - name: aida_attention
    dimension: marketing_principles
    definition: Does the page open with something that stops the reader?
    type: boolean
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      true: Something on the first screen (headline, visual, number) is genuinely arresting, not generic.
      false: The opening is generic enough that skipping it would lose nothing.

  - name: aida_interest
    dimension: marketing_principles
    definition: Does it give a reason to keep reading beyond the headline?
    type: boolean
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      true: There is a reason to keep reading beyond the headline - a specific detail, a question, a hinted benefit.
      false: The page front-loads everything, or gives no reason to continue past the first line.

  - name: aida_desire
    dimension: marketing_principles
    definition: Does it make the offer feel worth having, not just understood?
    type: boolean
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      true: The offer is made to feel worth having - concrete benefit, social proof or emotional payoff, not only a spec sheet.
      false: The page states facts (rate, features) without making the reader want the outcome.

  - name: aida_action
    dimension: marketing_principles
    definition: Is there an unmistakable next step?
    type: boolean
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    # clarified after the Belfius pension case (2 CTAs: "not yet
    # retired" vs "already retired") - multiple CTAs are still true when they
    # are clearly segmented by audience, so each visitor sees exactly one
    # obvious path. false is reserved for CTAs that genuinely compete for the
    # SAME visitor with no clear way to tell which applies.
    rubric:
      true: >
        There is one unmistakable next step - a single call to action, or
        several CTAs clearly segmented by audience/situation so each visitor
        still has exactly one obvious path (e.g. "not retired yet" vs
        "already retired").
      false: No clear call to action, or several CTAs competing for the same visitor with no clear way to tell which applies.

  - name: aida_coverage_score
    dimension: marketing_principles
    definition: How many of the four AIDA stages the page covers.
    type: integer
    range: [0, 4]
    extraction: derived
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  - name: persuasion_levers
    dimension: marketing_principles
    definition: Which of Cialdini's six persuasion principles are used on the page.
    type: list[string]
    values: [reciprocity, commitment, social_proof, authority, liking, scarcity]
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      reciprocity: The page offers something free or upfront before asking for commitment.
      commitment: The page asks for a small first step that implies a larger one.
      social_proof: The page cites other customers, ratings, review counts, or user numbers.
      authority: The page invokes expertise, credentials, regulator backing, or institutional tenure.
      liking: The page uses a friendly tone, relatable imagery, or a likeable brand voice to build affinity.
      scarcity: The page uses deadlines, limited availability, or "only until" language.
    notes: Turns the vague word "persuasive" into a closed, countable list.

  - name: persuasion_lever_count
    dimension: marketing_principles
    definition: Number of distinct persuasion levers detected.
    type: integer
    range: [0, 6]
    extraction: derived
    source: derived
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  # --- Banking-domain signals --------------
  # Not part of the original PRD section 11 dimensions - these come from retail-banking experience, added on top, nothing above removed.
  # Full rationale for each is in docs/ing_requirements.docx section 11 bis
  # and docs/ing_approach_and_project_plan.docx section 4.3 bis.

  - name: audience_segment
    dimension: banking_domain
    definition: Whether the page addresses an individual, a professional/self-employed activity, or both.
    type: categorical
    values: [retail, professional, mixed]
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    notes: retail vs pro is a different axis than traditional vs challenger; most banks run both but frame differently.

  - name: is_bundled_offer
    dimension: banking_domain
    definition: Whether the page pushes a bundle (account + card + insurance + investment) in the same funnel, rather than one isolated product.
    type: boolean
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    notes: the bancassurance model (bundled) vs single-product neobank is a business-model signal, not a tone or design choice.

  # is_bundled_offer above is 0/1 on "is a bundle pushed" - it cannot
  # tell KBC/BNP Paribas Fortis's in-house bancassurance (own product, dedicated
  # advisor, full regulatory disclosure load) apart from Revolut/N26's travel or
  # purchase-protection insurance (third-party partner, digital add-on, no
  # advisor). Both would score is_bundled_offer=true, erasing exactly the
  # distinction the team discussion flagged (15/09, ~4h30): cross-sell CAPACITY
  # (bancassurance) vs communication CONSTRAINT (more mandatory disclosures,
  # message diluted across 3-4 products) are two different, simultaneously true
  # effects, not one axis. Added alongside is_bundled_offer as a separate
  # column, rather than redefining what is_bundled_offer already means.
  - name: cross_sell_delivery_model
    dimension: banking_domain
    definition: How a cross-sold product (insurance, investment) is delivered when one is offered - an in-house product with a dedicated advisor (bancassurance), a digital add-on distributed through a third-party partner with no advisor, or not applicable (nothing cross-sold on this page).
    type: categorical
    values: [internal_advisor_led, partner_addon_digital, not_applicable]
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  # new feature, additive only (freeze rule) - fills a real gap
  # flagged in the "AI Marketing Intelligence Platform" brief discussion.
  # Reuses llm_extractor.py's existing single structured call (no new LLM
  # call, no new provider). Fixed 8-value taxonomy so the field stays
  # comparable across banks; aggregated to a per-bank distribution in
  # profiles.py. Flagged to Dan and Stephane per docs/decisions.md, 19/09.
  - name: target_personas
    dimension: banking_domain
    definition: Which customer persona archetypes this page's copy/imagery explicitly addresses.
    type: list[string]
    values: [student, family, entrepreneur_self_employed, expat, investor, retiree, digital_nomad, mass_market]
    extraction: model_assisted
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  # second additive feature from the same brief discussion as
  # target_personas above - fills the "cross-sell score/graph" gap. Reuses the
  # SAME 7-value product_family taxonomy already frozen in this dictionary
  # (never inventing a parallel one) so "possible products" has one definition
  # everywhere. See comparator/cross_sell.py for the score/matrix built from it.
  - name: cross_sold_products
    dimension: banking_domain
    definition: >
      Other products this page cross-sells or cross-references alongside its own
      product_family. Not limited to banking families: a page that pitches insurance,
      a credit card or a partner perk is cross-selling, and collapsing those into
      `other` counts a page naming ten add-ons the same as one naming a single unknown.
    type: list[string]
    values: [term_account, current_account_pack, savings_account, mortgage, investment,
             pension, insurance, credit_card, partner_perk, other]
    extraction: model_assisted
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  # third additive feature, same session - Siegried noticed
  # Revolut/bunq frame their tiers as a phone/streaming-style subscription
  # ("abonnement") rather than a traditional bancassurance "pack" - verified
  # in the raw page text (Revolut 16 mentions, bunq 9, every traditional bank
  # 0). Same single structured call as target_personas/cross_sold_products.
  - name: subscription_style_framing
    dimension: banking_domain
    definition: Whether the account tiers are framed as a subscription/plan (like a phone or streaming service) rather than a traditional banking "pack".
    type: boolean
    extraction: model_assisted
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  - name: rate_framing
    dimension: banking_domain
    definition: Whether the headline rate is the regulated base rate, a promotional bonus, a capped/tiered rate presented as the full rate, or no rate is shown.
    type: categorical
    values: [base_rate, promo_bonus, capped_tiered, not_shown]
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: within_capture_window
    tier: core
    required: true
    nullable: true
    notes: >
      complements rate_shown/rate_value_pct/rate_prominence (which measure IF and WHERE a
      rate appears) with WHAT KIND of rate it is. Belgian savings accounts are legally a base rate
      (>=0.50%) plus a fidelity/growth premium; a "capped_tiered" rate ("up to X%") applying only to a
      low ceiling or a short window is a known framing tactic.

  - name: primary_cta_type
    dimension: banking_domain
    definition: Whether the primary call to action is self-service online, booking an advisor/branch visit, or something else.
    type: categorical
    values: [self_service_online, book_advisor_or_branch, other]
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    notes: a distribution-model signal; a neobank structurally cannot offer book_advisor_or_branch.

  - name: switching_framing
    dimension: banking_domain
    definition: Whether the message reassures against switching away (retention) or actively encourages switching in (acquisition), if applicable at all.
    type: categorical
    values: [retention_reassurance, acquisition_encouragement, not_applicable]
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    notes: Belgium's bank-switching service makes this a concrete, mesurable framing choice, not a vague "tone".

  # "absent" used to be the only option for a page where no
  # mandated disclosure applies at all, which reads as a compliance red flag
  # ("should be there, isn't") for what is actually a category error. TAEG/APR
  # is a CREDIT disclosure (mortgage only, in this project's product_family
  # list) - it cannot exist on a term_account/savings_account page, which isn't
  # a credit product. The disclosure that's actually mandated depends on
  # product_family: TAEG for mortgage, the deposit guarantee scheme for
  # term_account/savings_account, a capital-at-risk warning for investment.
  # current_account_pack/other may have none of these apply at all - that's
  # what not_applicable is for, distinct from absent (which now means "a
  # disclosure DOES apply here and isn't shown").
  - name: regulatory_disclosure_prominence
    dimension: banking_domain
    definition: >
      How visible the mandated disclosure THAT APPLIES TO THIS PAGE'S product_family
      is: APR/TAEG for mortgage, the deposit guarantee scheme for
      term_account/savings_account, a capital-at-risk warning for investment.
      not_applicable when no such disclosure is expected for this product_family
      (e.g. a plain current_account_pack with no credit component) - do not score
      it "absent" in that case, absent is reserved for a disclosure that IS
      expected but isn't shown.
    type: categorical
    values: [prominent, present_not_prominent, absent, not_applicable]
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    notes: >
      distinct from disclaimer_present/disclaimer_word_share (which measure raw presence and
      word share automatically): this judges whether disclosures are placed where a reader will actually
      see them, which is what a compliance reviewer cares about.

  - name: hidden_conditions_behind_free_claim
    dimension: banking_domain
    definition: Whether "free" is the headline claim while conditions (minimum balance, usage requirement) sit in small print.
    type: boolean
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    notes: >
      not the deck's NPS-irritator finding (p.11's irritator is
      ad volume/frequency across channels, not hidden conditions behind a
      "free" claim, and isn't measurable from one page anyway). Stands on
      its own as a common banking dark pattern.

  - name: esg_claim_specificity
    dimension: banking_domain
    definition: Whether a sustainability claim carries a verifiable reference or figure, is an adjective only, or is absent.
    type: categorical
    values: [no_claim, vague_adjective_only, backed_by_reference_or_figure]
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    notes: >
      recalibrated from an earlier idea of reading the SFDR Article 6/8/9 classification
      directly off the page; that classification lives in the KID/prospectus, rarely on a marketing page,
      so this coarser version is the realistic one.

  - name: green_product_specific_benefit
    dimension: banking_domain
    definition: Whether a concrete financial benefit (e.g. a rate discount) is explicitly tied to a green/energy-performance criterion, vs a generic sustainability claim.
    type: boolean
    extraction: model_assisted  # was rubric - text-based judgement, moved into llm_extractor.py's structured call
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    notes: a green mortgage with an actual rate discount is a stronger signal than "we are sustainable".

  - name: mentions_loyalty_or_referral
    dimension: banking_domain
    definition: Whether the page advertises a loyalty programme or a referral scheme ("invite a friend").
    type: boolean
    extraction: automatic
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true
    notes: >
      a public-page proxy for CRM/retention strategy. True CRM/personalisation data sits
      behind authentication and is out of reach entirely (DR-01/DR-09) - this is not a substitute for it,
      just the closest observable signal on a public page.

  - name: images_have_alt_text
    dimension: banking_domain
    definition: Whether content images on the page carry non-empty alt text.
    type: boolean
    extraction: automatic
    source: html_text
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  - name: meta_title
