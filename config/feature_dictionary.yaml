    required: true
    nullable: true

  - name: palette_hex
    dimension: colours_design
    definition: Top five colours by pixel share, most frequent first.
    type: list[string]
    extraction: automatic
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true

  - name: brand_colour_share
    dimension: colours_design
    definition: Share of coloured pixels within tolerance of the bank's primary brand colour.
    type: float
    range: [0, 1]
    extraction: automatic
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    notes: The deck's claim that ING uses "not only orange" is measurable here.

  - name: accent_colour_count
    dimension: colours_design
    definition: Number of distinct accent colours used for emphasis.
    type: integer
    range: [0, null]
    extraction: automatic
    source: screenshot
    comparability: cross_language
    tier: extended
    required: false
    nullable: true

  - name: accent_locations
    dimension: colours_design
    definition: Where the brand accent actually appears.
    type: list[string]
    values: [text, icons, imagery, background, buttons]
    extraction: rubric
    source: screenshot
    comparability: cross_language
    tier: core
    required: true
    nullable: true
    # reviewed live against real KBC/Belfius/N26/Revolut/ING pages
    # (account, savings, pension, investment, mortgage, insurance, card) - refined
    # where real examples exposed a gap (see git history for the reasoning).
    rubric:
      text: Accent colour used on headlines or body text.
      icons: Accent colour used on icons or small graphic markers.
      imagery: Accent colour appears within the photos, illustrations or renders themselves.
      background: Accent colour used as a section or page background.
      buttons: Accent colour used on call-to-action buttons or other interactive elements.
    notes: >
      Directly tests the deck's distinction - Fortis uses green "in text and icons,
      not in pictures", Belfius uses red "in text and pictures".
      this is a perceptual judgement call, independent from the
      automatic brand_colour_share (strict pixel-distance match on the hero
      image only). The two are expected to disagree sometimes - e.g. a human
      says "yes, accent in imagery" for a subtle tint that brand_colour_share's
      Euclidean tolerance doesn't count. Do not try to reconcile them; report
      both, a mismatch between "looks branded" and "measures as branded" is
      itself a finding.

  - name: background_luminance
    dimension: colours_design
    definition: Mean relative luminance of the page background. 0 = black, 1 = white.
    type: float
    range: [0, 1]
