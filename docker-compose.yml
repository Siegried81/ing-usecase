services:
  # Streamlit dashboard - no API key required, reads the data baked into the image
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    # build + image: `docker compose up --build` builds from source and tags it with the
    # Docker Hub name; `docker compose pull` downloads the published image instead.
    image: ${DOCKERHUB_USERNAME:-siegried}/ing-comparator:latest
    container_name: ing-comparator-streamlit
    ports:
      - "8506:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # FastAPI backend — needs LLM_KEY, serves generated assets and recommendations
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Same Dockerfile as streamlit, so the same image: one pull serves both.
    image: ${DOCKERHUB_USERNAME:-siegried}/ing-comparator:latest
    container_name: ing-comparator-api
    ports:
      - "8006:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    # Optional: someone who pulled the image has no .env, and the UI must still start.
    env_file:
      - path: .env
        required: false
    volumes:
      # Generated recommendations and site survive a restart. Remove the volume
      # (docker compose down -v) to pick up new outputs from a newer image.
      - api_outputs:/app/outputs
    command: python3 scripts/serve_web.py --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Health dashboard - opt-in: docker compose --profile monitoring up
  dashboard:
    build:
      context: .
      dockerfile: services/Dockerfile
    image: ${DOCKERHUB_USERNAME:-siegried}/ing-comparator-dashboard:latest
    container_name: ing-comparator-dashboard
    profiles: [monitoring]
    ports:
      - "8606:8080"
    depends_on:
      - streamlit
      - api
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 2

volumes:
  api_outputs:
