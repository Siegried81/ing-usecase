  # steph 21/09: BNP refuses headless clients outright - every headless variant
  # (bundled Chromium, real Chrome, browser or bot User-Agent) returned HTTP 503
  # on every path including the homepage, while the same URL in a headful
  # browser returned 200. `method: headful` launches a real visible Chrome for
  # this host only. robots.txt allows both paths, one request is still made, and
  # nothing rotates IP or identity - see docs/decisions.md 21/09.
  - bank: bnp_paribas_fortis
    bank_category: traditional
    product_family: mortgage
    page_role: campaign_landing
    method: headful
    url: "https://www.bnpparibasfortis.be/fr/public/particuliers/emprunter/pret-immobilier/pret-hypothecaire"
    language: fr

