  # steve 21/09: Keytrade's KeyPack is its current-account package. Its site
  # never reaches networkidle (consent + analytics keep loading) and the
  # headless client stalls, so this target uses the headful browser and a
  # lighter navigation wait - the page is readable long before it goes idle.
  - bank: keytrade
    bank_category: challenger
    product_family: current_account_pack
    page_role: campaign_landing
    method: headful
    wait_until: domcontentloaded
    timeout_ms: 60000
    url: "https://www.keytradebank.be/fr/banque/keypack"
    language: fr

  - bank: beobank
    bank_category: traditional
    product_family: current_account_pack
    page_role: campaign_landing
