                <!--?lit$201521099$--><p style="margin: 0in; margin-left: .375in; font-family: Arial; font-size: 10.0pt;">Enjoying the 5% cashback is easy.</p>

        <h2 class="title  ">
          <!--?lit$201521099$-->Detailed information on the insurance products and non-insurance services in the pack ING More 
        </h2>
      <!----><!----><div><!--?lit$201521099$--><p class="MsoNormal"><span style="mso-ansi-language: EN-US;">The pack ING More includes insurance products designed to make your daily life safer, whether you are travelling, shopping online or attending events.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Below is an overview of the</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">insurances</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">included in the- pack ING More.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">For complete and detailed information, please refer to the terms &amp; conditions of each insurance product and non-insurance service.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><strong><span style="mso-ansi-language: EN-US;">Travel insurance</span><span>&nbsp;</span></strong></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">The travel insurance is provided under AXA Partners Travel Assistance and is underwritten by Inter Partner Assistance SA.</span><span>&nbsp;&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">It offers comprehensive protection for trips of up to</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">90 days, including urgent medical</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">assistance</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">and medical expenses abroad, teleconsultations and travel accidents. Your trips are insured as long as they are fully paid with the account linked to your pack ING More.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">Coverage limits:</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">- Medical assistance and expenses: up to </span><span>€</span><span style="mso-ansi-language: EN-US;">100,000</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">- Travel Accidents: up to </span><span>€</span><span style="mso-ansi-language: EN-US;">100,000</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">- Rescue and search costs: up to </span><span>€</span><span style="mso-ansi-language: EN-US;">30,000</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Exclusions apply, including medical expenses without prior approval, treatments received in your country of origin,</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">pre</span><span>‑</span><span style="mso-ansi-language: EN-US;">existing</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">medical conditions, travel against medical advice or for medical treatment,</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">non</span><span>‑</span><span style="mso-ansi-language: EN-US;">essential</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">or planned medical care, travel to destinations under official travel advisories, claims related to alcohol or drug use, professional or</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">high</span><span>‑</span><span style="mso-ansi-language: EN-US;">risk</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">sports including</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">off</span><span>‑</span><span style="mso-ansi-language: EN-US;">piste</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">winter sports, and events known before booking the trip, along with other limitations described in the terms and conditions.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">For full details, please check the</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">travel insurance terms and conditions.</span><span>&nbsp;&nbsp;</span></p>
<p class="MsoNormal"><strong><span style="mso-ansi-language: EN-US;">Cyber protection&nbsp;</span></strong></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">The cyber insurance is provided under EUROP ASSISTANCE S.A.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Coverage for direct financial losses</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">in the event of</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">identity theft.</span><span>&nbsp;&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Coverage limits: </span><span>€</span><span style="mso-ansi-language: EN-US;">250 for identity theft. The insurance covers a maximum of 1 claim per year.</span><span>&nbsp;&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Exclusions apply, including cash or goods theft, damage already covered by another insurer or by ING, incidents that occurred before the start of coverage; losses caused by poor cyber hygiene</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">(such as missing security updates or lack of antivirus); incidents involving illegal or pirated software; failures of external infrastructures (e.g. internet or power outages); indirect or undocumented losses (e.g. loss of profit or reputational damage); and damage to or replacement of devices, along with other limitations described in the terms and conditions.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">For full details, please check the</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">cyber insurance terms and conditions.</span></p>
<p class="MsoNormal"><strong><span style="mso-ansi-language: EN-US;">ID Protect</span><span>&nbsp;</span></strong></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">A service that scans the deep and dark web to detect whether your personal data</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">have</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">been compromised, such as leaked credentials or illicit use of your information, and sends you alerts so you can take prompt action.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Please note that this service is not automatically active. To use this service, activate it through the Protection Hub in your ING App.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">For full details, please check the ID Protect service terms and conditions.</span><span>&nbsp;&nbsp;</span></p>
<p class="MsoNormal"><strong><span style="mso-ansi-language: EN-US;">Delivery protection</span><span>&nbsp;</span></strong></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">The delivery protection insurance is provided under Chubb European Group SE.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Coverage for eligible purchases not delivered, damaged or stolen during delivery,</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">as long as</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">you paid with the account linked to your pack ING More.</span><span>&nbsp;&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Eligible items include goods that are:</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">purchased</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">new for personal use, bought from a registered</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">retailer</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">and transported by a professional transport operator.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Coverage limit</span><span style="mso-ansi-language: EN-US;">: </span><span>€</span><span style="mso-ansi-language: EN-US;">750 per year.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Exclusions apply, including negligence or</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">non</span><span>‑</span><span style="mso-ansi-language: EN-US;">reported</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">theft, certain categories of items such as</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">jewellery, vehicles, cash, animals and perishables; damage, loss or theft caused by negligence (e.g., leaving parcels unattended for an excessive period); theft of items stored at a collection point; claims where proof of delivery shows a signature or photo; claims with no valid tracking information; and cases where an incorrect delivery address contributed to the loss, along with other limitations described in the terms and conditions.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">For full details, please check the</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">delivery guarantee terms and conditions.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><strong><span style="mso-ansi-language: EN-US;">Purchase protection</span><span>&nbsp;</span></strong></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">The purchase protection insurance is provided under Chubb European Group SE.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">It covers the repair or replacement cost of eligible purchases of at least </span><span>€</span><span style="mso-ansi-language: EN-US;">50</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">in the event of</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">accidental damage,</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">theft</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">or loss within</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">90 days</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">of purchase (or delivery, if later), provided the item was paid for using the account linked to your pack ING More.</span><span>&nbsp;&nbsp;</span></p>
<p class="MsoNormal"><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">Coverage limits</span><span style="mso-ansi-language: EN-US;">: </span><span>€</span><span style="mso-ansi-language: EN-US;">3,000 per claim and per year.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">Exclusions apply, including purchases of live animals and plants, perishable goods, digital items and</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">jewellery, as well as other categories such as cash, vehicles, antiques and collectibles;</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">second</span><span>‑</span><span style="mso-ansi-language: EN-US;">hand</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">or used goods; normal wear and tear, cosmetic damage or manufacturing defects; damage covered by the manufacturer</span><span>’</span><span style="mso-ansi-language: EN-US;">s warranty; damage or theft caused by carelessness, or negligence; theft of items left unattended; and items lost or stolen without timely reporting, such as theft not reported to the police within</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">48 hours, along with additional limitations described in the terms and conditions.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">For full details, please check the</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">purchase protection terms and conditions.</span></p>
<p class="MsoNormal"><strong><span style="mso-ansi-language: EN-US;">Event cancellation protection</span><span>&nbsp;</span></strong></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">The event cancellation protection is provided under Chubb European Group SE.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">It covers refund of the</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">non</span><span>‑</span><span style="mso-ansi-language: EN-US;">refundable</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">part of your ticket for eligible cancellation reasons,</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">as long as</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">you paid the ticket with the account linked to your pack ING More.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Eligible reasons</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">include:</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">serious unforeseen illness, injury or death of you or an immediate family member; being required by the police after a burglary or major damage at home, delay or disruption of your transport, vehicle breakdown or accident causing over 3 hours</span><span>’</span><span style="mso-ansi-language: EN-US;"> delay.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Coverage limit:&nbsp;</span><span>€</span><span style="mso-ansi-language: EN-US;">500 per year. The insurance covers a maximum of 1 claim per year.</span><span>&nbsp;&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">Exclusions apply, including events cancelled or changed by the</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">organiser, tickets with travel or accommodation, business tickets, season passes, work obligations, known circumstances before purchase,</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">pre</span><span>‑</span><span style="mso-ansi-language: EN-US;">existing</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">medical conditions,</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">pandemics ,</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">missing or invalid ID, along with</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">additional</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">limitations described in the terms and conditions.</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">For full details, please check the</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">event cancellation insurance terms and conditions.</span><span>&nbsp;&nbsp;</span></p>
<p class="MsoNormal"><strong><span style="mso-ansi-language: EN-US;">Legal information concerning the ING More</span><span>&nbsp;&nbsp;</span></strong></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">The</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">ING More</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">is a pack that</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">contains</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">an ING More account. The</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">ING More Account</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">is a current account for adult private individuals. It can be applied for in an ING branch or directly online at ing.be, by using the ING</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">Home</span><span>’</span><span style="mso-ansi-language: EN-US;">Bank</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">services or the ING Banking</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">app,</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">and</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">is opened upon signature of an account opening form at an ING branch or remotely in the case of online applications. Online applications to open an account (via ing.be) are reserved solely for legally competent private individuals</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">residing</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">in Belgium at the time of application and with an e-mail address. A maximum of two account holders per ING More Account and no mandate holder can be authorized if an application is</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">submitted</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">online (via ing.be or the digital channels). Unless otherwise agreed, if there are two account holders, each holder has the same administrative powers and signs alone for his or her transactions (including closure of the account).</span><span>&nbsp;</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">The pack</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">contains</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">the following</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">insurances: Travel insurance, Cyber protection insurance, Delivery</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">protection, Purchase</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">protection</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">and Event cancellation protection. ING has taken out insurance policies as the policyholder for the benefit of its clients</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">with Insurers:</span><span>&nbsp;</span><span style="mso-ansi-language: EN-US;">AXA Partners Travel Assistance, EUROP ASSISTANCE S.A, Chubb European Group SE, AWP P&amp;C S.A</span></p>
<p class="MsoNormal"><span style="mso-ansi-language: EN-US;">This pack also includes the following optional ancillary service:</span><span>&nbsp;</span></p>
