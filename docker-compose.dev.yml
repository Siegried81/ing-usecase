# Development override: enables hot-reload, volume mounts, and extended timeouts
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  streamlit:
    environment:
      - STREAMLIT_SERVER_HEADLESS=false
      - STREAMLIT_LOGGER_LEVEL=debug
    volumes:
      # Full source tree for live reload
      - .:/app
      - /app/node_modules
      - /app/web/node_modules
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --logger.level=debug
    ports:
      - "8501:8501"

  api:
    environment:
      - DEBUG=1
      - RELOAD=1
    volumes:
      - .:/app
      - /app/node_modules
      - /app/web/node_modules
    command: python3 scripts/serve_web.py --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
