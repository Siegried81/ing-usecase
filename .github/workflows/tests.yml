# Runs the test suite and the schema freeze check on every push/PR, plus a
# pyflakes-level lint (unused imports/variables, undefined names) and a job
# that type-checks and builds the React UI, so a broken web/ cannot merge green.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # The dashboard and geo requirements are installed too. Without them
        # tests/test_streamlit_app.py and tests/test_geo_trends.py hit their
        # importorskip, so the whole dashboard suite was silently SKIPPED in CI
        # and a broken dashboard could merge green.
        run: pip install -r requirements.txt -r requirements-streamlit.txt -r requirements-geo.txt

      # F (pyflakes): dead code and undefined names. W: trailing whitespace and a
      # missing final newline, invisible edits that show up as noise in PR diffs.
      - name: Lint (pyflakes + whitespace rules)
        run: pip install ruff==0.16.9 && ruff check --select F,W .

      - name: Run tests
        run: python3 -m pytest tests/ -q

      - name: Check the feature dictionary against the frozen schema (Decision D5)
        run: python3 scripts/check_schema_freeze.py

      # The companion to the freeze check: freeze says the contract did not change
      # in a breaking way, this says the data still meets it. Fails on completeness,
      # validity or uniqueness; consistency and timeliness only warn.
      - name: Check data quality against thresholds
        run: python3 scripts/check_data_quality.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
